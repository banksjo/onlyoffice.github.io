<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Coastal Letter Formatter</title>

  <script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 18px;
      background: #ffffff;
      color: #222222;
    }

    h2 {
      margin: 0 0 8px 0;
      font-size: 18px;
    }

    p {
      margin: 6px 0 14px 0;
      font-size: 13px;
      line-height: 1.4;
    }

    button {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    #status {
      margin-top: 12px;
      font-size: 12px;
      line-height: 1.35;
    }
  </style>
</head>

<body>

  <h2>Coastal Letter Formatter</h2>

  <p>
    Formats the open Xestro/ONLYOFFICE correspondence
    without changing the clinical wording.
  </p>

  <button
    id="formatBtn"
    onclick="formatCoastalLetter()"
  >
    Format current letter
  </button>

  <div id="status">
    Loading…
  </div>

  <!--
    Cache-busting version number.
    Change v=12 to v=13, v=14, etc. whenever code.js is updated.
  -->
  <script src="code.js?v=12"></script>

</body>
</html>
